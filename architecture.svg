<svg xmlns="http://www.w3.org/2000/svg" width="900" height="780" viewBox="0 0 900 780" role="img" aria-labelledby="title desc">
  <title id="title">Digital Qareen conceptual execution governance</title>
  <desc id="desc">Human authority, AI proposals and identity context feed an independent policy decision. Denied or unresolved actions are held. Allowed actions require infrastructure checks before an external effect. Decisions and observed outcomes feed audit evidence. DQ-D2-V2 is a separate synthetic research scope; native T10 is not run.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#475569"/></marker></defs>
  <rect width="900" height="780" rx="18" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#172b4d">
    <text x="450" y="35" font-size="23" font-weight="bold">DIGITAL QAREEN</text>
    <text x="450" y="59" font-size="15">Conceptual architecture | Target design, not operational proof</text>
    <g fill="#fff" stroke="#94a3b8" stroke-width="1.5"><rect x="35" y="83" width="260" height="74" rx="9"/><rect x="320" y="83" width="260" height="74" rx="9"/><rect x="605" y="83" width="260" height="74" rx="9"/></g>
    <g font-size="17" font-weight="bold"><text x="165" y="111">Human authority</text><text x="450" y="111">AI agent</text><text x="735" y="111">Identity and context</text></g>
    <g font-size="15"><text x="165" y="135">Scoped, revocable intent</text><text x="450" y="135">Action proposal</text><text x="735" y="135">Bounded trust inputs</text></g>
    <rect x="35" y="196" width="830" height="275" rx="14" fill="#eaf2ff" stroke="#2459a6" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="55" y="217" text-anchor="start" font-size="14" font-weight="bold" fill="#2459a6">TARGET INDEPENDENT</text><text x="55" y="234" text-anchor="start" font-size="14" font-weight="bold" fill="#2459a6">EXECUTION BOUNDARY</text>
    <rect x="235" y="240" width="430" height="69" rx="9" fill="#fff" stroke="#2459a6" stroke-width="2"/>
    <text x="450" y="267" font-size="19" font-weight="bold">Policy decision</text><text x="450" y="290" font-size="15">Scope, binding and current authority</text>
    <g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"><path d="M165 157 V179 H395 V239"/><path d="M450 157 V239"/><path d="M735 157 V179 H505 V239"/><path d="M450 309 V330 H230 V367"/><path d="M450 309 V330 H670 V367"/></g>
    <text x="145" y="353" font-size="14" fill="#991b1b">Deny or unresolved</text><text x="755" y="353" font-size="14" fill="#166534">Allow within scope</text>
    <rect x="65" y="369" width="330" height="77" rx="9" fill="#fff1f2" stroke="#b43b3b" stroke-width="2"/><rect x="505" y="369" width="330" height="77" rx="9" fill="#ecfdf5" stroke="#178249" stroke-width="2"/>
    <text x="230" y="398" font-size="19" font-weight="bold" fill="#991b1b">Reject or hold</text><text x="230" y="421" font-size="15">No authorized dispatch</text>
    <text x="670" y="398" font-size="19" font-weight="bold" fill="#166534">Infrastructure enforcement</text><text x="670" y="421" font-size="15">Pre-effect checks</text>
    <path d="M505 415 H397" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="402" font-size="12">Checks fail</text>
    <path d="M670 446 V518" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="750" y="498" font-size="13">Checks satisfied</text>
    <rect x="505" y="520" width="330" height="68" rx="9" fill="#fff" stroke="#64748b" stroke-width="1.5"/><text x="670" y="546" font-size="18" font-weight="bold">External service or resource</text><text x="670" y="569" font-size="14">Provider-dependent effect guarantees</text>
    <rect x="65" y="610" width="770" height="62" rx="9" fill="#fff" stroke="#2459a6" stroke-width="1.5"/><text x="450" y="635" font-size="18" font-weight="bold">Audit and evidence</text><text x="450" y="655" font-size="14">Record decisions, enforcement observations and observed outcomes</text>
    <g fill="none" stroke="#475569" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow)"><path d="M235 275 H53 V600 H165 V609"/><path d="M230 446 V609"/><path d="M505 432 H472 V609"/><path d="M670 588 V609"/></g>
    <rect x="65" y="695" width="770" height="65" rx="9" fill="#fff7e5" stroke="#ab761d" stroke-width="2" stroke-dasharray="6 4"/><text x="450" y="719" font-size="17" font-weight="bold" fill="#815000">PUBLISHED SCOPE: DQ-D2-V2</text><text x="450" y="741" font-size="15">Metadata differential | Scoped synthetic evidence | Native T10: NOT_RUN</text>
  </g>
</svg>
